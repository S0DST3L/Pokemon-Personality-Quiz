    function PokemonQuiz() {
      const [currentQuestion, setCurrentQuestion] = useState(0);
      const [userScores, setUserScores] = useState({ types: {}, habitat: {}, style: {}, vibe: {} });
      const [isFinished, setIsFinished] = useState(false);

      const handleAnswer = (traits) => {
        const newScores = { ...userScores };
        Object.keys(traits).forEach((category) => {
          const categoryArray = traits[category];
          for (let i = 0; i < categoryArray.length; i += 2) {
            const traitName = categoryArray[i];
            const pointValue = categoryArray[i + 1];
            if (!newScores[category][traitName]) {
              newScores[category][traitName] = 0;
            }
            newScores[category][traitName] += pointValue;
          }
        });
        setUserScores(newScores);

        if (currentQuestion < QUESTIONS.length - 1) {
          setCurrentQuestion(currentQuestion + 1);
        } else {
          setIsFinished(true);
        }
      };

      const calculateResult = () => {
        let bestMatch = POKEMON_DB[0];
        let highestScore = -1;

        POKEMON_DB.forEach((pokemon) => {
          let currentScore = 0;
          pokemon.types.forEach(type => {
            if (userScores.types[type]) currentScore += userScores.types[type];
          });
          if (userScores.habitat[pokemon.habitat]) currentScore += userScores.habitat[pokemon.habitat];
          if (userScores.style[pokemon.style]) currentScore += userScores.style[pokemon.style];
          if (userScores.vibe[pokemon.vibe]) currentScore += userScores.vibe[pokemon.vibe];

          if (currentScore > highestScore) {
            highestScore = currentScore;
            bestMatch = pokemon;
          }
        });

        return { pokemon: bestMatch, score: highestScore };
      };

      const resetQuiz = () => {
        setCurrentQuestion(0);
        setUserScores({ types: {}, habitat: {}, style: {}, vibe: {} });
        setIsFinished(false);
      };

      const renderQuiz = () => {
        const question = QUESTIONS[currentQuestion];
        const progress = Math.round((currentQuestion / QUESTIONS.length) * 100);

        return (
          <div className="w-full max-w-2xl mx-auto bg-[#faf5fa] border-2 border-[#b5a7d1] shadow-[6px_6px_0px_0px_rgba(181,167,209,0.4)] flex flex-col font-sans">
            <div className="bg-gradient-to-r from-[#ffccee] via-[#e5ccee] to-[#cce5ff] p-1.5 flex justify-between items-center border-b-2 border-[#b5a7d1]">
              <div className="flex items-center gap-2 px-2">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" className="w-4 h-4 pixelated" alt="icon" />
                <span className="text-[#5e4b85] font-bold text-sm tracking-wide">
                  Personality_Quiz.exe
                </span>
              </div>
              <div className="flex gap-1 text-xs text-[#5e4b85] font-bold px-2">_ □ ✕</div>
            </div>

            <div className="p-6 bg-[#faf5fa] border-4 border-t-white border-l-white border-b-[#e0d6eb] border-r-[#e0d6eb]">
              <div className="mb-6 border-2 border-t-[#a3adc2] border-l-[#a3adc2] border-b-white border-r-white bg-white h-5 p-0.5 relative flex items-center">
                <div 
                  className="h-full bg-gradient-to-r from-[#ffccee] to-[#cce5ff] transition-all duration-300"
                  style={{ width: `${progress}%` }}
                ></div>
                <span className="absolute left-1/2 -translate-x-1/2 text-[10px] font-bold text-[#5e4b85]">
                  {progress}%
                </span>
              </div>

              <div className="text-xs font-bold text-[#8a7ba6] tracking-wider mb-2 uppercase">
                Question {currentQuestion + 1} of {QUESTIONS.length}
              </div>
              
              <h2 className="text-xl font-bold text-[#4a3b69] mb-6 min-h-[3rem]">
                {question.question}
              </h2>

              <div className="space-y-3">
                {question.options.map((option, index) => (
                  <button
                    key={index}
                    onClick={() => handleAnswer(option.traits)}
                    className="w-full text-left p-3 bg-[#fdfbfd] border-2 border-t-white border-l-white border-b-[#d1c5e3] border-r-[#d1c5e3] hover:bg-[#f0e6fa] active:border-t-[#d1c5e3] active:border-l-[#d1c5e3] active:border-b-white active:border-r-white active:bg-[#e8dcfa] transition-colors flex items-center justify-between"
                  >
                    <span className="text-[#5e4b85] font-medium text-sm">
                      {option.text}
                    </span>
                    <span className="text-[#b5a7d1] font-bold">→</span>
                  </button>
                ))}
              </div>
            </div>
          </div>
        );
      };

      const renderResult = () => {
        const { pokemon } = calculateResult();

        return (
          <div className="w-full max-w-2xl mx-auto bg-[#faf5fa] border-2 border-[#b5a7d1] shadow-[6px_6px_0px_0px_rgba(181,167,209,0.4)] flex flex-col font-sans">
            <div className="bg-gradient-to-r from-[#ffccee] via-[#e5ccee] to-[#cce5ff] p-1.5 flex justify-between items-center border-b-2 border-[#b5a7d1]">
              <div className="flex items-center gap-2 px-2">
                <span className="text-sm">✨</span>
                <span className="text-[#5e4b85] font-bold text-sm tracking-wide">
                  Result.exe
                </span>
              </div>
              <button className="text-xs text-[#854b54] font-bold px-2" onClick={resetQuiz}>✕</button>
            </div>

            <div className="p-8 text-center border-4 border-t-white border-l-white border-b-[#e0d6eb] border-r-[#e0d6eb]">
              <h2 className="text-3xl font-extrabold text-[#4a3b69] mb-3">
                You are {pokemon.name}!
              </h2>
              
              <div className="flex justify-center gap-2 mb-6">
                 {pokemon.types.map(type => (
                    <span key={type} className="px-3 py-1 bg-[#f0e6fa] border-2 border-t-white border-l-white border-b-[#d1c5e3] border-r-[#d1c5e3] text-xs font-bold text-[#5e4b85] uppercase tracking-widest">
                      {type}
                    </span>
                 ))}
              </div>

              <div className="relative w-48 h-48 mx-auto mb-8 bg-[#ffebf5] rounded-full flex items-center justify-center border-4 border-dashed border-[#ffccee]">
                <img 
                  src={pokemon.image} 
                  alt={pokemon.name} 
                  className="w-40 h-40 object-contain hover:scale-110 transition-transform duration-300"
                />
              </div>

              <div className="grid grid-cols-2 gap-4 mb-8 text-left">
                <div className="bg-[#f2fbff] p-3 border-2 border-t-white border-l-white border-b-[#bce1ff] border-r-[#bce1ff]">
                  <div className="text-[10px] font-bold text-[#7ca8c9] uppercase">Habitat</div>
                  <div className="text-sm font-semibold text-[#4a6b85]">{pokemon.habitat}</div>
                </div>
                <div className="bg-[#fff5e6] p-3 border-2 border-t-white border-l-white border-b-[#ffd699] border-r-[#ffd699]">
                  <div className="text-[10px] font-bold text-[#c99a63] uppercase">Combat Style</div>
                  <div className="text-sm font-semibold text-[#856138]">{pokemon.style}</div>
                </div>
                <div className="bg-[#fdfbfd] p-3 border-2 border-t-white border-l-white border-b-[#d1c5e3] border-r-[#d1c5e3] col-span-2 text-center">
                  <div className="text-[10px] font-bold text-[#9b8eb3] uppercase">Your Vibe</div>
                  <div className="text-sm font-semibold text-[#5e4b85]">{pokemon.vibe}</div>
                </div>
              </div>

              <button 
                onClick={resetQuiz}
                className="w-full py-3 bg-[#e6f0ff] text-[#4a6b85] border-2 border-t-white border-l-white border-b-[#a3adc2] border-r-[#a3adc2] active:border-t-[#a3adc2] active:border-l-[#a3adc2] active:border-b-white active:border-r-white active:bg-[#d6e5ff] font-bold transition-all text-sm uppercase tracking-wide"
              >
                Restart Sequence ↺
              </button>
            </div>
          </div>
        );
      };

      return (
        <div 
          className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden"
          style={{
            backgroundImage: `url(${ASSETS.background})`,
            backgroundSize: 'cover',
            backgroundPosition: 'center',
            backgroundAttachment: 'fixed'
          }}
        >
          {/* Floating Sprites */}
          <div className="absolute inset-0 pointer-events-none z-0">
            <img src={ASSETS.sprites[0]} className="absolute top-[10%] left-[5%] w-28 opacity-80 mix-blend-multiply float-slow" alt="sprite1" />
            <img src={ASSETS.sprites[1]} className="absolute bottom-[15%] right-[5%] w-28 opacity-80 mix-blend-multiply float-slow" style={{ animationDelay: '1s' }} alt="sprite2" />
            <img src={ASSETS.sprites[2]} className="absolute top-[20%] right-[10%] w-24 opacity-80 mix-blend-multiply float-slow" style={{ animationDelay: '2s' }} alt="sprite3" />
            <img src={ASSETS.sprites[3]} className="absolute bottom-[10%] left-[10%] w-24 opacity-80 mix-blend-multiply float-slow" style={{ animationDelay: '3s' }} alt="sprite4" />
          </div>

          <div className="relative z-10 w-full">
            {!isFinished ? renderQuiz() : renderResult()}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PokemonQuiz />);
  </script>
</body>
</html>
</html>
